<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/admin-autor.css">
    <title>Админ аутори</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg custom-navbar">
        <div class="container-fluid">
            
            <a class="navbar-brand text-white fw-bold" href="../index.html">Клуб књига</a>

            <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                Њ
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                
                <ul class="navbar-nav mx-auto align-items-lg-center gap-lg-3 text-center">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="../index.html">Почетна</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="autori.html">Аутори</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="../pages/admin_knjige.html">Админ књиге</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="../pages/admin_autori.html">Админ аутори</a>
                    </li>

                    <li class="nav-item">
                        <img class="profile-img" src="../images/профилна.jpg" alt="Профилна">
                    </li>
                </ul>
                <div class="d-flex gap-2">
                    <button class="btn btn-light btn-sm btn-1">Пријава</button>
                    <button class="btn btn-outline-light btn-sm">Регистрација</button>
                </div>
            </div>
        </div>
    </nav> 
    <div class="container py-5">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card shadow p-4">
                    <h4 mb-4><i class="fa-solid fa-user-plus"></i>Додај аутора</h4>
                    <form>
                        <div class="row">
                            <div class="col-12 col-md-6 mb-3">
                                <label for="ime" class="form-label">Име</label>
                                <input type="text" class="form-control" id="ime" placeholder="Унесите име">
                            </div>
                            <div class="col-12 col-md-6 mb-3">
                                <label for="prezime" class="form-label">Презиме</label>
                                <input type="text" class="form-control" id="prezime" placeholder="Унесите презиме">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="Biografija" class="form-label">Биографија</label>
                            <textarea class="form-control" id="Biografija" rows="3" placeholder="Кратка биографија"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="Slika" class="form-label">Слика</label>
                            <input type="file" class="form-control" id="Slika">
                        </div>
                        <div class="mb-3">
                            <label for="DatumRodjenja" class="form-label">Датум рођења</label>
                            <input type="date" class="form-control" id="DatumRodjenja">
                        </div>
                        <div class="mb-3">
                            <p>Статус</p>
                            <input type="radio" class="form-radio" id="Ziv" name="Status" value="Жив">
                            <label for="Ziv" class="form-label ml-2">Жив</label>
                            <input type="radio" class="form-radio" id="Mrtav" name="Status" value="Мртав">
                            <label for="Mrtav" class="form-label ml-2">Мртав</label>
                            <input type="radio" class="form-radio" id="U penziji" name="Status" value="У пензији">
                            <label for="U penziji" class="form-label ml-2">У пензији</label>
                        </div>
                        <div class="mb-3">
                            <label for="DatumSmrti" class="form-label">Датум смрти</label>
                            <input type="date" class="form-control" id="DatumSmrti" hidden>
                        </div>
                        <div class="mb-3">
                            <label for="brNagrada">Број освојених награда</label>
                            <input type="number" class="form-control" id="brNagrada" 
                            placeholder="Унесите број награда" min="0">
                        </div>
                        <div class="mb-3">
                            <label for="brProdanihPrimeraka">Број продатих примерака</label>
                            <input type="number" class="form-control" id="brProdanihPrimeraka" 
                            placeholder="Унесите број продатих примерака" min="0">
                        </div>
                        <div class="mb-3">
                            <label for="brTelefona">Број телефона менаџер</label>
                            <input type="tel" class="form-control" id="brTelefona" 
                            placeholder="97x-xx-xxxx-xxx-x" pattern="97[8-9]{1}-[0-9]{2}-[0-9]{4}-[0-9]{3}-[0-9]{1}">
                        </div>
                        <div class="d-flex gap-2 mt-3">
                            <button type="submit" class="btn btn-success w-100">Додај аутора</button>
                            <button type="reset" class="btn btn-warning w-100">Ажурирај аутора</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="col lg-8">
                <div class="card shadow p-4">
                    <h4><i class="fa-solid fa-table"></i>Листа аутора</h4>
                    <table class="table mt-3">
                        <thead>
                            <tr>
                                <th>Име</th>
                                <th>Презиме</th>
                                <th>Датум рођења</th>
                                <th>Статус</th>
                                <th>Акције</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Џ. К.</td>
                                <td>Роулинг</td>
                                <td>31.07.1965</td>
                                <td>Жив</td>
                                <td>
                                    <button class="btn btn-primary btn-sm" ><i class="fa-solid fa-pen-to-square"></i></button>
                                    <button class="btn btn-danger btn-sm"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                            <tr>
                                <td>Џорџ</td>
                                <td>Орвел</td>
                                <td>25.06.1903</td>
                                <td>Мртав</td>
                                <td>
                                    <button class="btn btn-primary btn-sm" ><i class="fa-solid fa-pen-to-square"></i></button>
                                    <button class="btn btn-danger btn-sm"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                            <tr>
                                <td>Џорџ Р. Р.</td>
                                <td>Толкиен</td>
                                <td>03.01.1892</td>
                                <td>Мртав</td>
                                <td>
                                    <button class="btn btn-primary btn-sm" ><i class="fa-solid fa-pen-to-square"></i></button>
                                    <button class="btn btn-danger btn-sm"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <div class="container">
            <p class="text-center text-black">&copy; 2026 Огњан Остовић и Никодин Грегорин. СВА ПРАВА ЗАДРЖАНА.</p>
        </div>
    </footer>
</body>
</html>
