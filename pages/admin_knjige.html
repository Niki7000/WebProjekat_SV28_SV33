    <div class="container mt-4">
        <h2 class="text-center mb-4">Администрација књига</h2>

        <div class="card admin-card add-book-card mb-4 mx-auto">
            <div class="card-body">
                <h4 class="mb-4 fw-bold">Додај нову књигу</h4>

                <form id="add-book-form">
                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">Назив</label>
                            <input type="text" id="naziv" class="form-control book-input">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Жанр</label>
                            <input type="text" id="zanr" class="form-control book-input">
                        </div>

                        <div class="col-12">
                            <label class="form-label">Опис</label>
                            <textarea id="opis" class="form-control book-input"></textarea>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Слика (URL)</label>
                            <input type="text" id="slika" class="form-control book-input">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Формат</label>
                            <input type="text" id="format" class="form-control book-input">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Цена</label>
                            <input type="number" id="cena" class="form-control book-input">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Број страна</label>
                            <input type="number" id="brojStrana" class="form-control book-input">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">ID Аутора</label>
                            <input type="text" id="idAutora" class="form-control book-input">
                        </div>

                        <div class="col-12">
                            <label class="form-label">ISBN</label>
                            <input type="text" id="isbn" class="form-control book-input">
                        </div>

                </div>
                
                <br>
                
                <h3 id="poruka"></h3>

                <button class="btn btn-custom mt-3">Додај књигу</button>
            </form>
            </div>
        </div>
    

        <div id="books-container">

        </div>
    </div>

                </div>

                <div class="modal-footer">

                    <button class="btn btn-secondary" data-bs-dismiss="modal">
                        Откажи
                    </button>

                    <button class="btn btn-danger" data-bs-dismiss="modal">
                        Обриши
                    </button>

                </div>

            </div>

        </div>
