<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="../css/knjiga.css">
        <link rel="stylesheet" href="../css/style.css">

        <title>Књига</title>
    </head>

    <body>
        <nav class="navbar navbar-expand-lg custom-navbar">
        <div class="container-fluid">
            
            <a class="navbar-brand text-white fw-bold" href="../index.html">Клуб књига</a>

            <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                Њ
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                
                <ul class="navbar-nav mx-auto align-items-lg-center gap-lg-3 text-center">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="../index.html">Почетна</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="../pages/autori.html">Аутори</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="../pages/admin_knjige.html">Админ књиге</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="../pages/admin_autori.html">Админ аутори</a>
                    </li>

                    <li class="nav-item" id="profile-nav">
                        <a href="korisnicki_profil.html">
                        <img class="profile-img" src="../images/профилна.jpg" alt="Профилна">
                        </a>
                    </li>
                    
                </ul>

               <div class="d-flex gap-2" id="auth-buttons">

                </div>

            </div>
        </div>
    </nav>

    <div class="container mt-5">

        <div class="row g-4">

            <div class="col-12 col-md-4 text-center">
                <img id="book-image" class="book-img" alt="Књига">
            </div>

            <div class="col-12 col-md-8">
                <h2 id="book-title"></h2>

                <p><strong>Аутор:</strong> 
                    <a id="book-author" href="#" class="author-link"></a>
                </p>

                <p><strong>Жанр:</strong> <span id="book-genre"></span></p>

                <p><strong>Формат:</strong> <span id="book-format"></span></p>

                <p><strong>Цена:</strong> <span id="book-price"></span></p>

                <p><strong>Број страна:</strong> <span id="book-pages"></span></p>

                <p><strong>ИСБН:</strong> <span id="book-isbn"></span></p>

                <p id="book-description" class="mt-3"></p>

            </div>

        </div>

        <div class="mt-5">
            <h3>Рецензије</h3>
            <div id="reviews-container"></div>
        </div>

        <div class="review-form mt-4">
            <h4>Оставите рецензију</h4>
            
            <form id="review-form">

                <div class="mb-3">

                    <textarea id="review-text" class="form-control" rows="4" placeholder="Унесите вашу рецензију..."></textarea>
                    <div id="review-error" class="text-danger mt-2" ></div>

                </div>
                <button type="submit" class="btn btn-custom">Пошаљи</button>

            </form>

        </div>

    </div>
    <br>

    <footer>
        <div class="container">

        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>

    <script src="../js/knjiga.js"></script>
    <script src="../js/auth.js"></script>
</html>
